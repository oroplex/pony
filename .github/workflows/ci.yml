name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # v3 defaults to the removed legacy `tools` package and fails with
      # "Failed to find package 'tools'". v4 installs platform-tools only.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK 36
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK and run unit and screenshot tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Assemble unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pony-companion-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pony-companion-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pony-companion-screenshots
          path: android/app/build/outputs/roborazzi/*.png
